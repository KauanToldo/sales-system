<!DOCTYPE html>
<html>

<head>
    <script src="https://unpkg.com/vue@3"></script>
</head>

<body>

    <div id="app">
        <h1>Usuarios</h1>
        <ul>
            <li v-for="u in users" :key="u.id">
                {{ u.id }} - {{ u.name }} - {{ u.email }}
            </li>
        </ul>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    users: []
                }
            },
            mounted() {
                fetch('http://localhost:8000/users')
                    .then(res => res.json())
                    .then(data => this.users = data);
            }
        }).mount('#app');
    </script>

</body>

</html>
